name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # goreleaser validates that HEAD is exactly the pushed tag; without
          # the tag refs in the clone that check (and tag detection) can fail.
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag explicitly: goreleaser reads this before any git-based
          # detection, so a shallow/partial clone can never produce a wrong or
          # "untagged" release name.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
