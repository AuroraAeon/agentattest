name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: fmt / vet / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt (fail on any unformatted file)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:${unformatted}"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  contract:
    # JSON Schema, CUE, and Rego validation all execute inside the Go test
    # suite (santhosh-tekuri/jsonschema, cuelang.org/go, open-policy-agent/opa).
    # These steps pin each contract gate explicitly so a failure names the gate.
    name: schema / CUE / Rego / golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: JSON Schema + CUE + Rego — golden fixtures
        run: go test ./internal/verify/ -run TestGoldenFixtures -count=1 -v
      - name: Stable failure-code ordering
        run: go test ./internal/verify/ -run TestFailureOrderingFixture -count=1
      - name: v0/v1 predicate version routing
        run: go test ./internal/verify/ -run 'TestPhase01VersionRouting|TestContractForVersion|TestStatementNewV1' -count=1

  smoke:
    # End-to-end exercise of the CLI entrypoint itself (not just packages):
    # build, init, digest, predicate create, context, verify, summary — plus a
    # golden invalid fixture that must fail closed with its stable code.
    name: CLI end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build CLI
        run: go build -o agentattest ./cmd/agentattest
      - name: version
        run: ./agentattest version
      - name: init + digest
        run: |
          ./agentattest init --dir .
          ./agentattest digest --repo . > digest.json
          grep -q '"digest"' digest.json
      - name: predicate create -> context -> verify (v1, evidence-grade)
        run: |
          ./agentattest predicate create --repo . --version v1 --agent-config AGENTS.md --out stmt.json
          ./agentattest context --repo . --required-level evidence-grade > ctx.json
          ./agentattest verify predicate --statement stmt.json --context ctx.json > result.json
          grep -q '"valid": true' result.json
          ./agentattest summary --statement stmt.json --context ctx.json | grep -q "Agent Provenance: valid"
      - name: invalid fixture fails closed with its stable code
        run: |
          if ./agentattest verify predicate \
              --statement tests/golden/invalid-level-downgrade/statement.json \
              --context tests/golden/invalid-level-downgrade/context.json > invalid.json; then
            echo "::error::verifier accepted an invalid fixture"
            exit 1
          fi
          grep -q '"level_below_required"' invalid.json

  test:
    # Cross-platform matrix: task 3 acceptance requires identical git/patch/
    # tree digests on Windows, macOS, and Linux.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: go test -race ./...
        run: go test -race ./... -count=1
